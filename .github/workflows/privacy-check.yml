# Privacy check: blocks secrets, private emails and personal terms from this repo.
# It never prints what it found (logs of public repos are public) — only which rule failed.
# PRIVATE_TERMS is a repo secret: one term per line (names, emails, IPs …).
name: privacy-check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --no-banner --log-level warn
      - name: Only private commit emails
        run: |
          bad=$(git log --all --format='%ae%n%ce' | sort -u \
            | grep -v -E '@users\.noreply\.github\.com$|^noreply@github\.com$|^noreply@anthropic\.com$|^minimax@local$' | wc -l)
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad commit email(s) are not a private noreply address. Set: git config --global user.email <id>+<user>@users.noreply.github.com"
            exit 1
          fi
      - name: No personal terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then echo "::warning::PRIVATE_TERMS secret is not set — skipped"; exit 0; fi
          git log --all -p --format='%B' > /tmp/history.txt
          n=0; found=0
          while IFS= read -r term; do
            [ -z "$term" ] && continue; n=$((n+1))
            if grep -q -i -F -- "$term" /tmp/history.txt; then echo "::error::personal term #$n found in the history"; found=1; fi
          done <<< "$PRIVATE_TERMS"
          exit $found
